const slides=[{"id": "P01", "kind": "hero", "kicker": "AI VISION · BEGINNER GUIDE", "title": "讓 AI 看懂圖片", "subtitle": "從影像分類到物件偵測與影像分割", "points": ["5 篇來源資料整理", "3 種核心電腦視覺任務", "14 張循序漸進的教學投影片"], "wiki": ["K01", "K08"], "sources": ["S01", "S03", "S04"]}, {"id": "P02", "kind": "goals", "kicker": "01 / 學習目標", "title": "學完之後，你能回答三個問題", "subtitle": "從日常圖片出發，不需要程式背景。", "points": ["AI 眼中的圖片是什麼？", "分類、偵測、分割差在哪裡？", "怎樣知道模型的判斷是否可靠？"], "wiki": ["K01", "K08", "K07"], "sources": ["S01", "S03", "S04", "S05"]}, {"id": "P03", "kind": "pixels", "kicker": "02 / 基礎觀念", "title": "AI 看到的，其實是一堆數字", "subtitle": "RGB 圖片可以想成很多小格子，每格記錄紅、綠、藍的強度。", "points": ["像素（Pixel）是影像最小的顏色單位之一。", "一張 32 × 32 彩色圖可表示為 32 × 32 × 3 的數值。", "光線、角度和遮蔽都可能影響辨識。"], "wiki": ["K01"], "sources": ["S01"]}, {"id": "P04", "kind": "classification", "kicker": "03 / 核心任務 A", "title": "影像分類：這張圖是什麼？", "subtitle": "模型替整張圖片選一個類別，但不一定知道物件在哪裡。", "points": ["輸入：一張圖片。", "輸出：例如「貓」的類別分數。", "應用：相片分類、產品種類判斷。"], "wiki": ["K02"], "sources": ["S01"]}, {"id": "P05", "kind": "cnn", "kicker": "04 / 模型方法", "title": "CNN：從局部特徵找到規律", "subtitle": "卷積神經網路會用可學習的濾波器，擷取像邊緣、紋理這類訊息。", "points": ["局部區域 → 偵測簡單特徵。", "多層組合 → 辨識更複雜的形狀。", "CNN 常是影像辨識模型的重要元件。"], "wiki": ["K03"], "sources": ["S02"]}, {"id": "P06", "kind": "detection", "kicker": "05 / 核心任務 B", "title": "物件偵測：東西在哪裡？", "subtitle": "除了回答『是什麼』，還要用方框指出『在哪裡』。", "points": ["輸出包含類別、Bounding Box（邊界框）、信心分數。", "可在一張圖片中找到多個物件。", "方框代表大致位置，不是精確輪廓。"], "wiki": ["K04"], "sources": ["S03"]}, {"id": "P07", "kind": "segmentation", "kicker": "06 / 核心任務 C", "title": "影像分割：輪廓有多精確？", "subtitle": "模型替每個像素決定類別，形成一塊塊遮罩。", "points": ["輸出是像素層級 Mask（遮罩）。", "比偵測方框更能反映物件形狀。", "應用：醫學影像、衛星影像、場景理解。"], "wiki": ["K05"], "sources": ["S04"]}, {"id": "P08", "kind": "compare", "kicker": "07 / 一眼看懂", "title": "三種任務，不要再搞混", "subtitle": "你需要什麼答案，決定你該選哪一種方法。", "points": ["分類：是什麼？ → 一個類別", "偵測：在哪裡？ → 一個或多個方框", "分割：形狀是什麼？ → 像素遮罩"], "wiki": ["K08"], "sources": ["S01", "S03", "S04"]}, {"id": "P09", "kind": "training", "kicker": "08 / 模型怎麼學", "title": "從資料到預測，要經過哪些步驟？", "subtitle": "不是把照片丟進去，模型就會自然理解世界。", "points": ["蒐集並標註資料。", "分出訓練、驗證與測試資料。", "訓練模型並在未見過的測試資料上評估。"], "wiki": ["K06"], "sources": ["S01"]}, {"id": "P10", "kind": "metrics", "kicker": "09 / 評估表現", "title": "準確率高，就一定好嗎？", "subtitle": "當罕見類別很少時，只看 Accuracy 可能得到誤導結論。", "points": ["Accuracy：所有樣本中，預測對的比例。", "Precision：預測為正的結果中，多少真的為正。", "Recall：真正為正的結果中，多少被找出。"], "wiki": ["K07"], "sources": ["S05"]}, {"id": "P11", "kind": "case", "kicker": "10 / 生活情境", "title": "想分析路口照片，選哪一個？", "subtitle": "同一張交通照片，因為問題不同，適合的任務也不同。", "points": ["只判斷有沒有汽車 → 分類。", "找出每一輛車的位置 → 偵測。", "描出每輛車的像素形狀 → 分割。"], "wiki": ["K08"], "sources": ["S01", "S03", "S04"]}, {"id": "P12", "kind": "caution", "kicker": "11 / 使用時要注意", "title": "AI 的輸出，不代表永遠正確", "subtitle": "辨識結果可能受到資料、場景、光線與標註方式影響。", "points": ["訓練資料不夠多樣，泛化能力可能不足。", "影像被遮住或光線改變，預測可能變差。", "重要用途要搭配人工覆核、適合的評估指標。"], "wiki": ["K01", "K06", "K07"], "sources": ["S01", "S05"]}, {"id": "P13", "kind": "quiz", "kicker": "12 / 快速測驗", "title": "選一個最合適的 AI 任務", "subtitle": "題目：你要讓模型把照片中的每隻狗圈出大致位置，應該用？", "points": ["A. 影像分類", "B. 物件偵測", "C. 影像分割"], "wiki": ["K08"], "sources": ["S03", "S04"]}, {"id": "P14", "kind": "closing", "kicker": "13 / 學習總結", "title": "從看懂一張圖，到看懂 AI 視覺", "subtitle": "分類回答『是什麼』；偵測回答『在哪裡』；分割回答『精確形狀』。", "points": ["5 篇正式參考來源可在 Wiki 頁面查看。", "簡報各頁附有 Wiki 條目與來源編號。", "檢查流程與測試紀錄可在 workflow.html 查看。"], "wiki": ["K08", "K07"], "sources": ["S01", "S02", "S03", "S04", "S05"]}]; const sources=[{"id": "S01", "title": "Image Classification: Data-driven Approach, kNN, train/val/test splits", "publisher": "Stanford CS231n", "url": "https://cs231n.github.io/classification/", "focus": "影像分類、像素表示、kNN 與訓練驗證測試的基本概念"}, {"id": "S02", "title": "Convolutional Neural Networks (CNNs / ConvNets)", "publisher": "Stanford CS231n", "url": "https://cs231n.github.io/convolutional-networks/", "focus": "卷積層、局部感受野、權重共享與影像特徵"}, {"id": "S03", "title": "Object Detection with Ultralytics YOLO", "publisher": "Ultralytics Docs", "url": "https://docs.ultralytics.com/tasks/detect/", "focus": "物件類別、位置、邊界框與信心分數"}, {"id": "S04", "title": "Image segmentation", "publisher": "TensorFlow Tutorials", "url": "https://www.tensorflow.org/tutorials/images/segmentation", "focus": "逐像素分類、分割遮罩與 U-Net 教學範例"}, {"id": "S05", "title": "Classification: Accuracy, recall, precision, and related metrics", "publisher": "Google Machine Learning Crash Course", "url": "https://developers.google.com/machine-learning/crash-course/classification/accuracy-precision-recall", "focus": "Accuracy、Precision、Recall 與不平衡資料的評估陷阱"}]; const sourceMap=Object.fromEntries(sources.map(s=>[s.id,s]));let idx=0;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function carSvg(mode){let bb=mode==='detection';let mask=mode==='segmentation';return `<svg class="photo" viewBox="0 0 650 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="街道與兩輛汽車的原創示意圖"><rect width="650" height="390" rx="26" fill="#a9dbe2"/><circle cx="520" cy="74" r="37" fill="#f8cf78"/><path d="M0 204 L100 142 L167 188 L230 130 L340 204 H650 V290 H0" fill="#81bdab"/><rect x="0" y="228" width="650" height="162" fill="#607c74"/><path d="M0 309 H650" stroke="#e8f3e4" stroke-width="8" stroke-dasharray="72 35"/><rect x="50" y="155" width="115" height="73" rx="4" fill="#e3f2e2"/><rect x="72" y="175" width="30" height="35" fill="#a0bbc0"/><rect x="116" y="175" width="27" height="35" fill="#a0bbc0"/><rect x="408" y="162" width="130" height="75" rx="4" fill="#e9f3e9"/><rect x="431" y="181" width="37" height="32" fill="#a0bbc0"/><rect x="478" y="181" width="36" height="32" fill="#a0bbc0"/><g><path d="M105 267 l36 -42 h125 l41 42 v39 H105 Z" fill="${mask?'#39e0ab':'#f6bf61'}"/><path d="M160 234 h93 l25 31 H131Z" fill="#b8e2e7"/><circle cx="163" cy="306" r="24" fill="#1e383a"/><circle cx="269" cy="306" r="24" fill="#1e383a"/><circle cx="163" cy="306" r="12" fill="#d9e5df"/><circle cx="269" cy="306" r="12" fill="#d9e5df"/></g><g><path d="M362 278 l27 -32 h99 l34 32 v34 H362 Z" fill="${mask?'#35cba8':'#e7a26d'}"/><path d="M406 253 h70 l22 26 H385Z" fill="#acd8e0"/><circle cx="398" cy="311" r="21" fill="#213c3f"/><circle cx="492" cy="311" r="21" fill="#213c3f"/><circle cx="398" cy="311" r="10" fill="#d9e5df"/><circle cx="492" cy="311" r="10" fill="#d9e5df"/></g>${bb?'<rect x="92" y="213" width="227" height="121" rx="4" fill="none" stroke="#14f0b1" stroke-width="6"/><rect x="355" y="237" width="176" height="102" rx="4" fill="none" stroke="#14f0b1" stroke-width="6"/><rect x="92" y="184" width="133" height="30" fill="#143d35"/><text x="105" y="206" font-size="21" fill="white">CAR 0.96</text><rect x="355" y="207" width="135" height="30" fill="#143d35"/><text x="367" y="230" font-size="21" fill="white">CAR 0.92</text>':''}${mask?'<path d="M107 266 l32 -40 129 0 39 43 v39 h-18 a24 24 0 0 0 -43 0 h-60 a24 24 0 0 0 -44 0 h-34z" fill="none" stroke="#007658" stroke-width="5"/><rect x="14" y="15" width="138" height="35" rx="10" fill="#124c40"/><text x="28" y="40" fill="white" font-size="20">PIXEL MASK</text>':''}</svg>`}
function visual(kind){const icon={classification:'🐱',goals:'🎯',caution:'🛡️',closing:'✨'};if(kind==='detection'||kind==='segmentation'||kind==='case')return carSvg(kind==='case'?'detection':kind);
if(kind==='classification')return `<div style="width:90%;max-width:440px;text-align:center"><div style="background:#c3e9d3;border-radius:26px;font-size:clamp(115px,13vw,195px);padding:30px">🐈</div><div style="margin-top:15px;background:white;border-radius:14px;padding:17px;font-weight:800;font-size:24px">分類輸出：貓 🐱</div></div>`;
if(kind==='pixels')return `<div style="text-align:center"><div style="display:grid;grid-template-columns:repeat(7,45px);gap:4px;justify-content:center">${Array.from({length:35},(_,i)=>`<div style="height:45px;background:hsl(${150+(i%7)*9},${45+(i%5)*4}%,${34+Math.floor(i/7)*10}%);border-radius:5px"></div>`).join('')}</div><p style="font-weight:800;font-size:22px">圖片 = 像素 × 顏色通道</p></div>`;
if(kind==='cnn')return `<div style="text-align:center;width:100%"><div style="display:flex;gap:10px;align-items:center;justify-content:center"><div style="display:grid;grid-template-columns:repeat(5,32px);gap:4px">${Array.from({length:25},(_,i)=>`<div style="height:32px;background:${(i%5>0&&i%5<4&&Math.floor(i/5)>0&&Math.floor(i/5)<4)?'#3cc89c':'#b1d9c5'};border-radius:4px"></div>`).join('')}</div><b style="font-size:42px">→</b><div style="display:grid;grid-template-columns:repeat(3,40px);gap:5px">${Array.from({length:9},(_,i)=>`<div style="height:40px;background:${i%2?'#257963':'#79d5ac'};border-radius:4px"></div>`).join('')}</div></div><p style="font-size:20px;font-weight:800">局部視窗 → 特徵圖</p><p style="color:#527469">教學示意，非模型真實預測圖</p></div>`;
if(kind==='metrics')return `<div class="metric-grid"><div><b>90%</b><small>Accuracy｜示意</small></div><div><b>80%</b><small>Precision｜示意</small></div><div><b>67%</b><small>Recall｜示意</small></div><div><b>?</b><small>先看類別分布</small></div></div>`;
if(kind==='compare')return `<div class="compare-grid"><div><b>分類 Classification</b><span>整張圖 → 一個類別</span></div><div><b>偵測 Detection</b><span>多個物件 → 方框＋類別</span></div><div><b>分割 Segmentation</b><span>每個像素 → 類別遮罩</span></div></div>`;
if(kind==='training')return `<div style="display:grid;gap:16px;width:90%">${['📦 資料與標註','🧠 訓練模型','🔎 驗證調整','✅ 最終測試'].map((x,i)=>`<div style="padding:19px 25px;border-radius:16px;background:${i===3?'#a7efd0':'white'};font-size:23px;font-weight:800;text-align:center">${x}</div>`).join('')}</div>`;
if(kind==='quiz')return `<div style="width:100%;text-align:center"><div style="font-size:110px">📷</div><button class="quiz-opt" data-q="A">A. 影像分類</button><button class="quiz-opt" data-q="B">B. 物件偵測</button><button class="quiz-opt" data-q="C">C. 影像分割</button><p id="quiz-feedback" aria-live="polite"></p></div>`;
if(kind==='goals')return `<div style="text-align:center"><div style="font-size:clamp(130px,19vw,230px)">🧩</div><p style="font-size:25px;font-weight:900">WHAT · WHERE · SHAPE</p></div>`;
if(kind==='closing')return `<div style="text-align:center"><div style="font-size:130px">✨</div><p style="font-size:25px;font-weight:900">KNOW → CHECK → TEACH</p><a class="btn" href="index.html" style="display:inline-block;text-decoration:none">返回知識庫</a></div>`;
if(kind==='caution')return `<div style="width:90%;text-align:center"><div style="font-size:150px">🛡️</div><p style="font-size:24px;font-weight:800">查核資料 · 選對指標 · 人工覆核</p></div>`;
return `<div style="font-size:160px">✦</div>`;}
function render(){const s=slides[idx];let hero=s.kind==='hero';let titleTag=hero?'h1':'h2';let src=s.sources.map(id=>`<a target="_blank" rel="noopener" href="${sourceMap[id].url}" title="${esc(sourceMap[id].title)}">${id}</a>`).join('');let wiki=s.wiki.map(id=>`<a href="index.html#${id}" title="到 Wiki 查看條目 ${id}">${id}</a>`).join('');document.getElementById('slide').className='slide'+(hero?' hero-slide':'');document.getElementById('slide').innerHTML=`<div class="slide-main"><div class="eyebrow">${esc(s.kicker)}</div><${titleTag}>${esc(s.title)}</${titleTag}><div class="sub">${esc(s.subtitle)}</div><ul class="checks">${s.points.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><footer class="slide-footer"><span class="label">Wiki</span>${wiki}<span class="label" style="margin-left:9px">來源</span>${src}</footer></div><div class="visual">${visual(s.kind)}<span class="mini-label">概念示意圖｜非真實模型推論</span></div>`;
 document.getElementById('count').textContent=`${idx+1} / ${slides.length}`;document.getElementById('bar').style.width=`${(idx+1)/slides.length*100}%`;document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===slides.length-1;document.querySelectorAll('.toc button').forEach((e,i)=>{e.classList.toggle('active',i===idx);e.setAttribute('aria-current',i===idx?'step':'false')});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const ok=b.dataset.q==='B';const f=document.getElementById('quiz-feedback');f.textContent=ok?'答對！要找出物件的大致位置，使用物件偵測。':'再想想：題目要求的是「每隻狗的大致位置」，不是單一類別或精確輪廓。';f.style.color=ok?'#09684d':'#a15a2d'});}
function go(n){idx=Math.max(0,Math.min(slides.length-1,n));render()}
document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('next').onclick=()=>go(idx+1);
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();go(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();go(idx-1)}});
const toc=document.getElementById('toc');slides.forEach((s,i)=>{let b=document.createElement('button');b.textContent=i+1;b.title=s.title;b.setAttribute('aria-label',`第${i+1}頁 ${s.title}`);b.onclick=()=>go(i);toc.appendChild(b)});render();
</script></body></html>
